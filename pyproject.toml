[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.1.0"
description = "Task-bound agent security and evidence reconciliation prototype"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentguard = "agentguard.cli:main"

[tool.setuptools.packages.find]
include = ["agentguard*"]
